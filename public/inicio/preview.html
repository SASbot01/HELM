<!--
  La vista previa de /paginainicio para los bots que NO ejecutan JavaScript:
  WhatsApp, Telegram, Twitter, Slack, LinkedIn, Discord y los buscadores.

  La página real es la de React (src/pages/PaginaInicio.jsx), pero un bot solo
  lee el HTML que le llega: si le sirviéramos el index.html de la SPA, la tarjeta
  del enlace enseñaría el título del panel de gestión. Vercel manda aquí SOLO a
  esos user-agents (ver vercel.json); una persona sigue viendo la página normal.

  Si aun así entra alguien —un bot que se hace pasar por navegador, un enlace
  copiado a mano— el script del final lo devuelve a la página buena.
-->
