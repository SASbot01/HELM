<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HELM">
  <title>HELM — puesto de mando</title>
  <defs>
    <linearGradient id="helmBg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#191C24"/>
      <stop offset="1" stop-color="#06060B"/>
    </linearGradient>
    <linearGradient id="helmPlat" x1="24" y1="18" x2="78" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAFBFE"/>
      <stop offset="0.52" stop-color="#C6CCD7"/>
      <stop offset="1" stop-color="#7A8494"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#helmBg)"/>
  <!-- rueda de timón: aro + radios -->
  <g stroke="url(#helmPlat)" fill="none" stroke-width="3" stroke-linecap="round">
    <circle cx="50" cy="50" r="23.5"/>
    <line x1="50" y1="50" x2="50" y2="20"/>
    <line x1="50" y1="50" x2="50" y2="80"/>
    <line x1="50" y1="50" x2="20" y2="50"/>
    <line x1="50" y1="50" x2="80" y2="50"/>
    <line x1="50" y1="50" x2="28.8" y2="28.8"/>
    <line x1="50" y1="50" x2="71.2" y2="71.2"/>
    <line x1="50" y1="50" x2="28.8" y2="71.2"/>
    <line x1="50" y1="50" x2="71.2" y2="28.8"/>
  </g>
  <!-- pomos (los 8 mangos del timón) -->
  <g fill="url(#helmPlat)">
    <circle cx="50" cy="20" r="3.6"/>
    <circle cx="50" cy="80" r="3.6"/>
    <circle cx="20" cy="50" r="3.6"/>
    <circle cx="80" cy="50" r="3.6"/>
    <circle cx="28.8" cy="28.8" r="3.6"/>
    <circle cx="71.2" cy="71.2" r="3.6"/>
    <circle cx="28.8" cy="71.2" r="3.6"/>
    <circle cx="71.2" cy="28.8" r="3.6"/>
  </g>
  <!-- cubo central -->
  <circle cx="50" cy="50" r="5.5" fill="url(#helmPlat)"/>
</svg>
